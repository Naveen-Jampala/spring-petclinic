name: Java-Workflow

on:
  push:
    branches:
      - main

jobs:
  build:                    #telling it that build or deploy job
    name: my-spc            #name: our wish
    runs-on: self-hosted
    steps:
      - name: Git_checkout
        uses: actions/checkout@v4

      - name: sonarqube scan
        env:
          SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
        run: | 
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=Naveen-Jampala_spring-petclinic \
            -Dsonar.organization=naveen-jampala \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN